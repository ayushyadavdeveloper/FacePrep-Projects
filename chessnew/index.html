<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeeksforGeeks Chess Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>GeeksforGeeks</h1>

    <div class="chessboard">

        <!-- BLACK PIECES -->
        <div class="box light">♜</div>
        <div class="box dark">♞</div>
        <div class="box light">♝</div>
        <div class="box dark">♛</div>
        <div class="box light">♚</div>
        <div class="box dark">♝</div>
        <div class="box light">♞</div>
        <div class="box dark">♜</div>

        <div class="box dark">♟</div>
        <div class="box light">♟</div>
        <div class="box dark">♟</div>
        <div class="box light">♟</div>
        <div class="box dark">♟</div>
        <div class="box light">♟</div>
        <div class="box dark">♟</div>
        <div class="box light">♟</div>

        <!-- EMPTY -->
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>

        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>

        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>

        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>
        <div class="box dark"></div>
        <div class="box light"></div>

        <!-- WHITE PAWNS -->
        <div class="box light white-piece">♙</div>
        <div class="box dark white-piece">♙</div>
        <div class="box light white-piece">♙</div>
        <div class="box dark white-piece">♙</div>
        <div class="box light white-piece">♙</div>
        <div class="box dark white-piece">♙</div>
        <div class="box light white-piece">♙</div>
        <div class="box dark white-piece">♙</div>

        <!-- WHITE PIECES -->
        <div class="box dark white-piece">♖</div>
        <div class="box light white-piece">♘</div>
        <div class="box dark white-piece">♗</div>
        <div class="box light white-piece">♕</div>
        <div class="box dark white-piece">♔</div>
        <div class="box light white-piece">♗</div>
        <div class="box dark white-piece">♘</div>
        <div class="box light white-piece">♖</div>

    </div>

</body>
</html>

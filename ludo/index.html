<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="board">

    <!-- Green home (top-left) -->
    <div class="home green">
      <div class="home-box">
        <span class="dot green-dot"></span>
        <span class="dot green-dot"></span>
        <span class="dot green-dot"></span>
        <span class="dot green-dot"></span>
      </div>
    </div>

    <!-- Top path arm -->
    <div class="arm top-arm">
      <span class="arrow yellow-arrow">▼</span>
      <span class="star"></span>
    </div>

    <!-- Yellow home (top-right) -->
    <div class="home yellow">
      <div class="home-box">
        <span class="dot yellow-dot"></span>
        <span class="dot yellow-dot"></span>
        <span class="dot yellow-dot"></span>
        <span class="dot yellow-dot"></span>
      </div>
    </div>

    <!-- Left path arm -->
    <div class="arm left-arm">
      <span class="arrow green-arrow">&#9658;</span>
      <span class="star"></span>
    </div>

    <!-- Center pinwheel -->
    <div class="center">
      <div class="triangle triangle-top green-tri"></div>
      <div class="triangle triangle-right yellow-tri"></div>
      <div class="triangle triangle-bottom blue-tri"></div>
      <div class="triangle triangle-left red-tri"></div>
    </div>

    <!-- Right path arm -->
    <div class="arm right-arm">
      <span class="arrow blue-arrow">&#9668;</span>
      <span class="star"></span>
    </div>

    <!-- Red home (bottom-left) -->
    <div class="home red">
      <div class="home-box">
        <span class="dot red-dot"></span>
        <span class="dot red-dot"></span>
        <span class="dot red-dot"></span>
        <span class="dot red-dot"></span>
      </div>
    </div>

    <!-- Bottom path arm -->
    <div class="arm bottom-arm">
      <span class="star"></span>
      <span class="arrow red-arrow">&#9650;</span>
    </div>

    <!-- Blue home (bottom-right) -->
    <div class="home blue">
      <div class="home-box">
        <span class="dot blue-dot"></span>
        <span class="dot blue-dot"></span>
        <span class="dot blue-dot"></span>
        <span class="dot blue-dot"></span>
      </div>
    </div>

  </div>

</body>
</html>
